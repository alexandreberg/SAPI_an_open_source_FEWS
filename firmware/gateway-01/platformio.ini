; PlatformIO Project Configuration File - Gateway-01 (Production)
; https://docs.platformio.org/page/projectconf.html
; Supports: Station-01 (legacy), Station-02, Station-03

[env:esp32dev] ; LilyGO T-SIM7000G LoRa Board

platform = espressif32
board = esp32dev
framework = arduino

; Pacotes opcionais, caso precise forçar versão específica do Arduino-ESP32
; platform_packages =
;     framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32#release/v3.1.x

; TODO: Adjust port to match the gateway-01 USB connection on your machine
;       Windows example: COM15
;       Linux example:   /dev/ttyUSB0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
upload_port = /dev/ttyACM0
upload_speed = 921600

lib_ldf_mode = deep+

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -mfix-esp32-psram-cache-issue
    -DTINY_GSM_MODEM_SIM7000
    -DTINY_GSM_RX_BUFFER=1024
    -DARDUINO_LOOP_STACK_SIZE=32768  ; BearSSL TLS handshake needs ~12-15 KB stack

lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    vshymanskyy/TinyGSM @ ^0.12.0
    vshymanskyy/StreamDebugger @ ^1.0.1
    ; adafruit/DHT sensor library @ ^1.4.6
    bblanchon/ArduinoJson @ ^7.4.2
    openslab-osu/SSLClient                  @ ^1.6.11
    arduino-libraries/ArduinoHttpClient     @ ^0.6.1

name: audit
# Blocks a push/PR that would publish a credential or a real identifier.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the audit scans the whole history
          lfs: false       # never download LFS objects here: it would spend the owner's LFS bandwidth
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          echo "GITLEAKS=$PWD/gitleaks" >> "$GITHUB_ENV"
      - name: Audit
        run: tools/audit.sh

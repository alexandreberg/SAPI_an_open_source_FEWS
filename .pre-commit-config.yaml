# Install once:  pipx install pre-commit && pre-commit install
# Every commit is then scanned for secrets before it is created.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      # LFS pointers are tiny, so this only trips on a big file that is NOT in LFS.
      - id: check-added-large-files
        args: ["--maxkb=5000"]

  - repo: local
    hooks:
      - id: sapi-audit
        name: SAPI credential / identifier audit
        entry: tools/audit.sh
        language: system
        pass_filenames: false
        always_run: true
